# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hanko-go

release:
  github:
    owner: foomo
    name: hanko-go
  prerelease: auto

builds:
  - skip: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

changelog:
  use: github-native
